name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest

      - name: Build Docker image
        run: docker build -t cicd-pipeline-app .

      - name: Run Docker Contanier
        run: |
              docker run -d --name cicd-pipeline-container -p 8000:8000 cicd-pipeline-app
              sleep 5
              curl http://localhost:8000/health

      - name: Stop Docker Container
        run: docker rm -f cicd-pipeline-container


      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
           registry: ghcr.io
           username: ${{ github.actor }}
           password: ${{ secrets.GITHUB_TOKEN }}


      - name: Tag Docker Image
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          docker tag cicd-pipeline-app:latest ghcr.io/$OWNER/cicd-pipeline-app:${{ github.sha }}
          docker tag cicd-pipeline-app:latest ghcr.io/$OWNER/cicd-pipeline-app:latest

      - name: Check Docker Image
        run: docker images

      - name: Push Docker image
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          docker push ghcr.io/$OWNER/cicd-pipeline-app:${{ github.sha }}
          docker push ghcr.io/$OWNER/cicd-pipeline-app:latest

  deploy:
    needs: test
    runs-on: self-hosted

    steps:
      - name: Pull Docker image
        run: |
          docker pull ghcr.io/meliox-7/cicd-pipeline-app:latest
          docker rm -f cicd-pipeline-container || true
          docker run -d --name cicd-pipeline-container -p 8000:8000 ghcr.io/meliox-7/cicd-pipeline-app:latest

      - name: Check deployed application
        run: |
          sleep 5
          curl --fail http://localhost:8000/health
