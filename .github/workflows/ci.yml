name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest

      - name: Build Docker image
        run: docker build -t cicd-pipeline-app .

      - name: Run Docker Contanier
        run: |
              docker run -d --name cicd-pipeline-container -p 8000:8000 cicd-pipeline-app
              sleep 5
              curl http://localhost:8000/health

      - name: Stop Docker Container
        run: docker rm -f cicd-pipeline-container


      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
           registry: ghcr.io
           username: ${{ github.actor }}
           password: ${{ secrets.GITHUB_TOKEN }}


      - name: Tag Docker Image
        run: docker tag cicd-pipeline-app ghcr.io/${{ github.repository_owner }}/cicd-pipeline-app:latest


      - name: Push Docker image
        run: docker push ghcr.io/${{ github.repository_owner }}/cicd-pipeline-app:latest

